<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Registration | ComplaintBox</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="auth-body">
  <div class="auth-shell">
    <div class="auth-card wide">
      <div class="auth-header">
        <span class="badge">Restricted Setup</span>
        <h2>Admin Registration</h2>
      </div>

      <form id="adminRegisterForm" class="auth-form">
        <label for="name">Full Name</label>
        <input id="name" type="text" placeholder="Administrator name" required />

        <label for="email">Admin Email</label>
        <input id="email" type="email" placeholder="name@hostel.com" required />

        <label for="password">Password</label>
        <input id="password" type="password" minlength="12" placeholder="At least 12 characters" required />

        <button class="primary-btn" type="submit">Create Admin Account</button>
      </form>

      <div class="auth-links">
        <a href="/admin-login.html">Admin Login</a>
        <a href="/">Home</a>
      </div>

      <div id="message" class="message"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('adminRegisterForm');
    const message = document.getElementById('message');

    function setMessage(text, type) {
      message.className = 'message';
      if (type) message.classList.add(type);
      message.textContent = text;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      };

      try {
        const response = await fetch('/api/auth/admin/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Admin registration failed');

        form.reset();
        setMessage(`Admin account created for ${data.name}. You can now sign in.`, 'success');
      } catch (error) {
        setMessage(error.message, 'error');
      }
    });
  </script>
</body>
</html>
